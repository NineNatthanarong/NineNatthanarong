name: Telemetry panels

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/generate_assets.py
      - .github/workflows/telemetry.yml

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate_assets.py

      - name: Commit refreshed panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore: refresh telemetry panels"
          git push
