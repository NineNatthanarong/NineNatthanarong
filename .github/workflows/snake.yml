name: Contribution snake

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF2E4C&color_dots=%23eeeeee,%23ffb3bf,%23ff6b7f,%23ff2e4c,%23a5142c
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF2E4C&color_dots=%230d0b0e,%234a0a16,%238c0f24,%23cc1a38,%23ff2e4c

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
