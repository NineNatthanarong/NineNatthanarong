<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Natthanarong Tiangjit — AI Software Developer">
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7A0C1F"/>
      <stop offset="100%" stop-color="#FF2E4C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E4C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2E4C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2E4C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E4C" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF2E4C" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .fade { opacity: 0; animation: fade .8s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes drift { from { transform: translateX(-320px); } to { transform: translateX(1220px); } }
    .sweep { animation: drift 5.5s linear infinite; }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    .rule { stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 1.4s .3s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .l1 { animation-delay: .1s; } .l2 { animation-delay: .35s; } .l3 { animation-delay: .6s; }
  </style>

  <rect width="1000" height="260" fill="#08070A"/>
  <g opacity="0.55"><line x1="0" y1="0" x2="0" y2="260" stroke="#241419" stroke-width="1"/><line x1="40" y1="0" x2="40" y2="260" stroke="#241419" stroke-width="1"/><line x1="80" y1="0" x2="80" y2="260" stroke="#241419" stroke-width="1"/><line x1="120" y1="0" x2="120" y2="260" stroke="#241419" stroke-width="1"/><line x1="160" y1="0" x2="160" y2="260" stroke="#241419" stroke-width="1"/><line x1="200" y1="0" x2="200" y2="260" stroke="#241419" stroke-width="1"/><line x1="240" y1="0" x2="240" y2="260" stroke="#241419" stroke-width="1"/><line x1="280" y1="0" x2="280" y2="260" stroke="#241419" stroke-width="1"/><line x1="320" y1="0" x2="320" y2="260" stroke="#241419" stroke-width="1"/><line x1="360" y1="0" x2="360" y2="260" stroke="#241419" stroke-width="1"/><line x1="400" y1="0" x2="400" y2="260" stroke="#241419" stroke-width="1"/><line x1="440" y1="0" x2="440" y2="260" stroke="#241419" stroke-width="1"/><line x1="480" y1="0" x2="480" y2="260" stroke="#241419" stroke-width="1"/><line x1="520" y1="0" x2="520" y2="260" stroke="#241419" stroke-width="1"/><line x1="560" y1="0" x2="560" y2="260" stroke="#241419" stroke-width="1"/><line x1="600" y1="0" x2="600" y2="260" stroke="#241419" stroke-width="1"/><line x1="640" y1="0" x2="640" y2="260" stroke="#241419" stroke-width="1"/><line x1="680" y1="0" x2="680" y2="260" stroke="#241419" stroke-width="1"/><line x1="720" y1="0" x2="720" y2="260" stroke="#241419" stroke-width="1"/><line x1="760" y1="0" x2="760" y2="260" stroke="#241419" stroke-width="1"/><line x1="800" y1="0" x2="800" y2="260" stroke="#241419" stroke-width="1"/><line x1="840" y1="0" x2="840" y2="260" stroke="#241419" stroke-width="1"/><line x1="880" y1="0" x2="880" y2="260" stroke="#241419" stroke-width="1"/><line x1="920" y1="0" x2="920" y2="260" stroke="#241419" stroke-width="1"/><line x1="960" y1="0" x2="960" y2="260" stroke="#241419" stroke-width="1"/><line x1="0" y1="0" x2="1000" y2="0" stroke="#241419" stroke-width="1"/><line x1="0" y1="40" x2="1000" y2="40" stroke="#241419" stroke-width="1"/><line x1="0" y1="80" x2="1000" y2="80" stroke="#241419" stroke-width="1"/><line x1="0" y1="120" x2="1000" y2="120" stroke="#241419" stroke-width="1"/><line x1="0" y1="160" x2="1000" y2="160" stroke="#241419" stroke-width="1"/><line x1="0" y1="200" x2="1000" y2="200" stroke="#241419" stroke-width="1"/><line x1="0" y1="240" x2="1000" y2="240" stroke="#241419" stroke-width="1"/></g>
  <ellipse cx="500" cy="150" rx="440" ry="180" fill="url(#halo)"/>
  <rect class="sweep" x="-320" y="0" width="320" height="260" fill="url(#sweep)"/>

  <g class="fade l1">
    <circle class="dot" cx="60" cy="66" r="4" fill="#FF2E4C" filter="url(#soft)"/>
    <text x="76" y="71" class="mono" font-size="13" letter-spacing="3.5" fill="#FF2E4C">BANGKOK · BUILDING NOW</text>
  </g>

  <text x="58" y="139" class="sans fade l2" font-size="46" font-weight="700" letter-spacing="-1" fill="#F5F5F7">Natthanarong Tiangjit</text>
