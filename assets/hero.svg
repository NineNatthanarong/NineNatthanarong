    <text x="58" y="228">AI ENGINEERING</text>
    <text x="228" y="228">·</text>
    <text x="252" y="228">FULL-STACK</text>
    <text x="378" y="228">·</text>
    <text x="402" y="228">ROBOTICS</text>
  </g>

  <g class="fade l3">
    <path d="M942 34 h24 v24" fill="none" stroke="#FF2E4C" stroke-width="2"/>
    <path d="M942 226 h24 v-24" fill="none" stroke="#FF2E4C" stroke-width="2"/>
