<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Where the commits go">
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7A0C1F"/>
      <stop offset="100%" stop-color="#FF2E4C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E4C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2E4C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2E4C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E4C" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF2E4C" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .fade { opacity: 0; animation: fade .8s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes drift { from { transform: translateX(-320px); } to { transform: translateX(1220px); } }
    @keyframes reveal { from { stroke-dasharray: 0 490; } }
    @keyframes stretch { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .s0 { animation: reveal 1s cubic-bezier(.2,.8,.2,1) 0.00s both; }
    .s1 { animation: reveal 1s cubic-bezier(.2,.8,.2,1) 0.15s both; }
    .s2 { animation: reveal 1s cubic-bezier(.2,.8,.2,1) 0.30s both; }
    .s3 { animation: reveal 1s cubic-bezier(.2,.8,.2,1) 0.45s both; }
    .s4 { animation: reveal 1s cubic-bezier(.2,.8,.2,1) 0.60s both; }
    .r0 { transform-origin: 560px 0px; animation: stretch .9s cubic-bezier(.2,.8,.2,1) 0.20s both; }
    .r1 { transform-origin: 560px 0px; animation: stretch .9s cubic-bezier(.2,.8,.2,1) 0.29s both; }
    .r2 { transform-origin: 560px 0px; animation: stretch .9s cubic-bezier(.2,.8,.2,1) 0.38s both; }
    .r3 { transform-origin: 560px 0px; animation: stretch .9s cubic-bezier(.2,.8,.2,1) 0.47s both; }
    .r4 { transform-origin: 560px 0px; animation: stretch .9s cubic-bezier(.2,.8,.2,1) 0.56s both; }
  </style>

  <rect width="1000" height="330" rx="16" fill="#08070A"/>
  <ellipse cx="200" cy="180" rx="260" ry="160" fill="url(#halo)" opacity="0.5"/>

  <text x="60" y="52" class="sans" font-size="24" font-weight="700" fill="#F5F5F7">Where the work goes.</text>
  <text x="60" y="76" class="sans" font-size="14" fill="#86868B">Commits by language, and the repos they land in.</text>

  <circle class="seg s0" cx="172.0" cy="178.0" r="78.0" fill="none" stroke="#FF2E4C" stroke-width="26.0" stroke-linecap="butt" stroke-dasharray="291.92 198.17" stroke-dashoffset="-0.00" transform="rotate(-90 172.0 178.0)"/><circle class="seg s1" cx="172.0" cy="178.0" r="78.0" fill="none" stroke="#D81E3C" stroke-width="26.0" stroke-linecap="butt" stroke-dasharray="161.81 328.28" stroke-dashoffset="-294.92" transform="rotate(-90 172.0 178.0)"/><circle class="seg s2" cx="172.0" cy="178.0" r="78.0" fill="none" stroke="#A5142C" stroke-width="26.0" stroke-linecap="butt" stroke-dasharray="14.35 475.74" stroke-dashoffset="-459.73" transform="rotate(-90 172.0 178.0)"/><circle class="seg s3" cx="172.0" cy="178.0" r="78.0" fill="none" stroke="#6E0F1E" stroke-width="26.0" stroke-linecap="butt" stroke-dasharray="5.67 484.41" stroke-dashoffset="-477.08" transform="rotate(-90 172.0 178.0)"/><circle class="seg s4" cx="172.0" cy="178.0" r="78.0" fill="none" stroke="#3D0A12" stroke-width="26.0" stroke-linecap="butt" stroke-dasharray="1.34 488.75" stroke-dashoffset="-485.75" transform="rotate(-90 172.0 178.0)"/>
  <text x="172.0" y="180.0" class="sans" font-size="34" font-weight="700" text-anchor="middle" fill="#F5F5F7">113</text>
  <text x="172.0" y="202.0" class="mono" font-size="10" letter-spacing="2" text-anchor="middle" fill="#86868B">COMMITS</text>
  <g class="fade" style="animation-delay:0.5s"><rect x="300" y="105" width="10" height="10" rx="2" fill="#FF2E4C"/><text x="322" y="115" class="sans" font-size="14" fill="#F5F5F7">Python</text><text x="472" y="115" class="mono" font-size="12" text-anchor="end" fill="#86868B">60%</text></g><g class="fade" style="animation-delay:0.6s"><rect x="300" y="139" width="10" height="10" rx="2" fill="#D81E3C"/><text x="322" y="149" class="sans" font-size="14" fill="#F5F5F7">TypeScript</text><text x="472" y="149" class="mono" font-size="12" text-anchor="end" fill="#86868B">34%</text></g><g class="fade" style="animation-delay:0.7s"><rect x="300" y="173" width="10" height="10" rx="2" fill="#A5142C"/><text x="322" y="183" class="sans" font-size="14" fill="#F5F5F7">JavaScript</text><text x="472" y="183" class="mono" font-size="12" text-anchor="end" fill="#86868B">4%</text></g><g class="fade" style="animation-delay:0.8s"><rect x="300" y="207" width="10" height="10" rx="2" fill="#6E0F1E"/><text x="322" y="217" class="sans" font-size="14" fill="#F5F5F7">Jupyter Notebook</text><text x="472" y="217" class="mono" font-size="12" text-anchor="end" fill="#86868B">2%</text></g><g class="fade" style="animation-delay:0.9s"><rect x="300" y="241" width="10" height="10" rx="2" fill="#3D0A12"/><text x="322" y="251" class="sans" font-size="14" fill="#F5F5F7">Other</text><text x="472" y="251" class="mono" font-size="12" text-anchor="end" fill="#86868B">1%</text></g>

  <line x1="516" y1="96" x2="516" y2="300" stroke="#241419" stroke-width="1"/>
  <text x="560" y="80" class="mono" font-size="10.5" letter-spacing="2" fill="#FF2E4C">MOST ACTIVE REPOSITORIES</text>
  <text x="560" y="104" class="mono" font-size="12" fill="#86868B">NRAG</text><rect x="560" y="112" width="300" height="8" rx="4" fill="#100A0D"/><rect class="rb r0" x="560" y="112" width="300.0" height="8" rx="4" fill="url(#bar)"/><text x="940" y="120" class="mono" font-size="12" text-anchor="end" fill="#FF2E4C">29</text><text x="560" y="146" class="mono" font-size="12" fill="#86868B">nine.codes</text><rect x="560" y="154" width="300" height="8" rx="4" fill="#100A0D"/><rect class="rb r1" x="560" y="154" width="196.6" height="8" rx="4" fill="url(#bar)"/><text x="940" y="162" class="mono" font-size="12" text-anchor="end" fill="#FF2E4C">19</text><text x="560" y="188" class="mono" font-size="12" fill="#86868B">OneDegree</text><rect x="560" y="196" width="300" height="8" rx="4" fill="#100A0D"/><rect class="rb r2" x="560" y="196" width="134.5" height="8" rx="4" fill="url(#bar)"/><text x="940" y="204" class="mono" font-size="12" text-anchor="end" fill="#FF2E4C">13</text><text x="560" y="230" class="mono" font-size="12" fill="#86868B">LadderX</text><rect x="560" y="238" width="300" height="8" rx="4" fill="#100A0D"/><rect class="rb r3" x="560" y="238" width="134.5" height="8" rx="4" fill="url(#bar)"/><text x="940" y="246" class="mono" font-size="12" text-anchor="end" fill="#FF2E4C">13</text><text x="560" y="272" class="mono" font-size="12" fill="#86868B">Case-3-Media-Behavior</text><rect x="560" y="280" width="300" height="8" rx="4" fill="#100A0D"/><rect class="rb r4" x="560" y="280" width="124.1" height="8" rx="4" fill="url(#bar)"/><text x="940" y="288" class="mono" font-size="12" text-anchor="end" fill="#FF2E4C">12</text>
</svg>
